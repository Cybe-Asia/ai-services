name: Build staging ai container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: staging-ai-container
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - name: Freeze source and release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          python3 scripts/export-staging-container.py /tmp/ai-container release-evidence/source.json
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          source = json.loads(Path('release-evidence/source.json').read_text())
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + ':sha-' + source['revision']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image=' + image + '\n')
              output.write('revision=' + source['revision'] + '\n')
              output.write('source_hash=' + source['source_snapshot_sha256'] + '\n')
          PYTHON
      - name: Build Linux image
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
          RELEASE_SOURCE_HASH: ${{ steps.release.outputs.source_hash }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg SOURCE_REPOSITORY="https://github.com/$GITHUB_REPOSITORY" \
            --build-arg SOURCE_REVISION="$RELEASE_REVISION" \
            --build-arg SOURCE_TREE_SHA256="$RELEASE_SOURCE_HASH" \
            -t "$RELEASE_IMAGE" /tmp/ai-container
      - name: Release generated build storage
        run: |
          rm -rf /tmp/ai-container
          docker builder prune --all --force
          df -h /
      - name: Required vulnerability gate
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.72.0
          image-ref: ${{ steps.release.outputs.image }}
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: release-evidence/scan.json
          timeout: 15m
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.72.0
          skip-setup-trivy: true
          image-ref: ${{ steps.release.outputs.image }}
          format: spdx-json
          output: release-evidence/sbom.spdx.json
          timeout: 15m
      - name: Publish scanned image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$RELEASE_IMAGE"
          docker image inspect "$RELEASE_IMAGE" > release-evidence/image.json
          docker logout ghcr.io
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-staging-release-${{ github.sha }}
          path: release-evidence/
          retention-days: 30
